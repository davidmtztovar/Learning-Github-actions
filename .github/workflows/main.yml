name: my-first-workflow
#To get triggered on every push
on: 
  schedule:
    - cron: "1/ * * * *"
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Running Single Command in Job1
        run: echo "Hello world"
      - name: Checking OS Release for GitHub Hosted runner
        run: cat /etc/os-release
      - name: Calling Sleep
        run: sleep 20

  job2: 
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: Checking runner hostname
        run: hostname
      - name: Running multiple commands
        run: 
          echo "Running multiple commands"
          echo "Current time is `date `"

  job3: 
    name: JOB3
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Job with single dependency
        run: 
          echo "running job 3"
          sleep 10

  job4: 
      name: JOB3
      needs:
        - job2
        - job3
      runs-on: ubuntu-latest
      steps:
        - name: Job with multiple dependencies
          run: 
            echo "running job 4"
            sleep 10

     
